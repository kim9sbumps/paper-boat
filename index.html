<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종이배</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #e5e0d8;
      font-family: 'Gowun Batang', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .paper-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #faf7f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-space {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-space > .note-line:first-child {
      margin-top: auto;
    }
    .note-line {
      font-size: 16px;
      line-height: 20px;
      word-break: break-all;
      animation: fadeIn 0.4s ease-in-out;
    }

    .my-msg { text-align: right; margin-left: 25%; }
    .other-msg { text-align: left; margin-right: 25%; }

    .color-soleum { color: #800000; } /* 김솔음: 버건디 잉크 */
    .color-saheon { color: #386b2c; } /* 백사헌: 올리브 그린 잉크 */

    .input-box {
      padding: 16px 20px;
      background: #faf7f0;
      border-top: 1px solid #e3ddd3;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1; border: none; background: transparent;
      border-bottom: 1px solid #8c7b6c;
      font-family: 'Gowun Batang', serif;
      font-size: 15px; padding: 6px 4px; outline: none; color: #2c2520;
    }
    button {
      background: #8c7b6c; color: #fff; border: none;
      padding: 6px 16px; font-family: 'Gowun Batang', serif;
      font-size: 14px; cursor: pointer; border-radius: 2px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="paper-container">
  <div class="chat-space" id="chatSpace"></div>
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="종이배에 메시지를 남겨 보세요." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">전송</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz-ZqrpYsX-17wZiBXRVxiO2utYBpt5ybm-RvY4_Nnz2qJc9b4csxuc5VPMffA8BPI0/exec";
  
  const urlParams = new URLSearchParams(window.location.search);
  const rawUser = urlParams.get('user') || '김솔음';
  const currentUser = decodeURIComponent(rawUser);

  let firstIndex = 0; 
  let lastIndex = 0;  
  let pollTimer = null;
  let isLoadingMore = false; 
  let hasMoreHistory = true; 
  let isSending = false; // 중복 전송 방지 플래그

  const chatSpace = document.getElementById('chatSpace');

  function calcDynamicLimit() {
    const containerHeight = chatSpace.clientHeight || window.innerHeight;
    const estimatedMsgHeight = 45;
    const neededCount = Math.ceil(containerHeight / estimatedMsgHeight) + 3;
    return Math.max(5, neededCount);
  }

  function createMessageNode(sender, message, index) {
    const line = document.createElement('div');
    const alignClass = (sender === currentUser) ? 'my-msg' : 'other-msg';
    const colorClass = (sender === '김솔음') ? 'color-soleum' : 'color-saheon';
    
    line.className = `note-line ${alignClass} ${colorClass}`;
    if (index) line.setAttribute('data-index', index);
    line.innerText = message;
    return line;
  }

  function scrollToBottom() {
    chatSpace.scrollTop = chatSpace.scrollHeight;
  }

  async function initMessages() {
    if (!GAS_URL || GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
    
    const limit = calcDynamicLimit();
    
    try {
      const res = await fetch(`${GAS_URL}?mode=init&limit=${limit}`);
      const data = await res.json();
      
      if (Array.isArray(data) && data.length > 0) {
        chatSpace.innerHTML = '';
        data.forEach(item => {
          const node = createMessageNode(item.sender, item.message, item.index);
          chatSpace.appendChild(node);
        });
        firstIndex = data[0].index;
        lastIndex = data[data.length - 1].index;
        
        if (firstIndex <= 1) hasMoreHistory = false;
        scrollToBottom();
      }
    } catch(e) {
      console.error("초기 로드 오류:", e);
    }
  }

  async function pollNewMessages() {
    if (!GAS_URL || GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
    
    try {
      const res = await fetch(`${GAS_URL}?mode=poll&lastIndex=${lastIndex}`);
      const data = await res.json();
      
      if (Array.isArray(data) && data.length > 0) {
        data.forEach(item => {
          // 중복 렌더링 방지 체크
          if (!document.querySelector(`[data-index="${item.index}"]`)) {
            const node = createMessageNode(item.sender, item.message, item.index);
            chatSpace.appendChild(node);
            lastIndex = item.index;
          }
        });
        scrollToBottom();
      }
    } catch(e) {
      console.error("실시간 동기화 오류:", e);
    }
  }

  async function loadMoreHistory() {
    if (isLoadingMore || !hasMoreHistory || firstIndex <= 1) return;
    isLoadingMore = true;

    const previousScrollHeight = chatSpace.scrollHeight;
    const limit = calcDynamicLimit();

    try {
      const res = await fetch(`${GAS_URL}?mode=more&beforeIndex=${firstIndex}&limit=${limit}`);
      const data = await res.json();

      if (Array.isArray(data) && data.length > 0) {
        const fragment = document.createDocumentFragment();
        data.forEach(item => {
          if (!document.querySelector(`[data-index="${item.index}"]`)) {
            const node = createMessageNode(item.sender, item.message, item.index);
            fragment.appendChild(node);
          }
        });
        
        chatSpace.insertBefore(fragment, chatSpace.firstChild);
        firstIndex = data[0].index;

        const newScrollHeight = chatSpace.scrollHeight;
        chatSpace.scrollTop = newScrollHeight - previousScrollHeight;

        if (firstIndex <= 1) hasMoreHistory = false;
      } else {
        hasMoreHistory = false;
      }
    } catch(e) {
      console.error("이전 대화 로드 오류:", e);
    } finally {
      isLoadingMore = false;
    }
  }

  async function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || isSending) return;

    isSending = true; // 연속 클릭 방지
    input.value = '';
    input.focus();

    if (GAS_URL && !GAS_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ sender: currentUser, message: text })
        });
        await pollNewMessages(); // 전송 직후 즉시 새 동기화
      } catch(e) {
        console.error("전송 실패:", e);
      } finally {
        isSending = false;
      }
    }
  }

  function startPolling() {
    if (!pollTimer) {
      pollNewMessages();
      pollTimer = setInterval(pollNewMessages, 3000);
    }
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPolling();
    else startPolling();
  });

  chatSpace.addEventListener('scroll', () => {
    if (chatSpace.scrollTop <= 30) {
      loadMoreHistory();
    }
  });

  chatSpace.addEventListener('wheel', (e) => {
    if (chatSpace.scrollTop === 0 && e.deltaY < 0) {
      loadMoreHistory();
    }
  });

  async function init() {
    await initMessages();
    startPolling();
  }

  init();
</script>

</body>
</html>
