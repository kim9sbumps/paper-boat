<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종이배</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #e5e0d8;
      font-family: 'Gowun Batang', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .paper-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #faf7f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-space {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-space > .note-line:first-child {
      margin-top: auto;
    }
    .note-line {
      font-size: 16px;
      line-height: 20px;
      word-break: break-all;
      animation: fadeIn 0.4s ease-in-out;
    }
    .my-msg { text-align: right; color: #1a426e; margin-left: 25%; }
    .other-msg { text-align: left; color: #3b2a1d; margin-right: 25%; }
    .input-box {
      padding: 16px 20px;
      background: #faf7f0;
      border-top: 1px solid #e3ddd3;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1; border: none; background: transparent;
      border-bottom: 1px solid #8c7b6c;
      font-family: 'Gowun Batang', serif;
      font-size: 15px; padding: 6px 4px; outline: none; color: #2c2520;
    }
    button {
      background: #8c7b6c; color: #fff; border: none;
      padding: 6px 16px; font-family: 'Gowun Batang', serif;
      font-size: 14px; cursor: pointer; border-radius: 2px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="paper-container">
  <div class="chat-space" id="chatSpace"></div>
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="종이배에 메시지를 남겨 보세요." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">전송</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz-ZqrpYsX-17wZiBXRVxiO2utYBpt5ybm-RvY4_Nnz2qJc9b4csxuc5VPMffA8BPI0/exec";
  
  const urlParams = new URLSearchParams(window.location.search);
  const rawUser = urlParams.get('user') || 'A';
  const currentUser = decodeURIComponent(rawUser);

  let firstIndex = 0; 
  let lastIndex = 0;  
  let pollTimer = null;
  let isLoadingMore = false; 
  let hasMoreHistory = true; 

  const chatSpace = document.getElementById('chatSpace');

  // [핵심] 현재 화면 높이에 맞춰 적절한 메시지 개수를 동적으로 계산
  function calcDynamicLimit() {
    const containerHeight = chatSpace.clientHeight || window.innerHeight;
    const estimatedMsgHeight = 45; // 메시지 1개당 평균 높이 (px)
    
    // 화면을 채우는 데 필요한 개수 + 여유분 3개 (최소 5개 이상)
    const neededCount = Math.ceil(containerHeight / estimatedMsgHeight) + 3;
    return Math.max(5, neededCount);
  }

  function createMessageNode(sender, message) {
    const line = document.createElement('div');
    line.className = `note-line ${sender === currentUser ? 'my-msg' : 'other-msg'}`;
    line.innerText = message;
    return line;
  }

  function appendMessage(sender, message) {
    const node = createMessageNode(sender, message);
    chatSpace.appendChild(node);
    scrollToBottom();
  }

  function scrollToBottom() {
    chatSpace.scrollTop = chatSpace.scrollHeight;
  }

  // 초기 로드: 동적으로 계산된 개수만큼 요청
  async function initMessages() {
    if (!GAS_URL || GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") return;
    
    const limit = calcDynamicLimit(); // 화면 크기 기반 개수 산출
    
    try {
      const res = await fetch(`${GAS_URL}?mode=init&limit=${limit}`);
      const data = await res.json();
      
      if (data && data.length > 0) {
        chatSpace.innerHTML = '';
        data.forEach(item => {
          const node = createMessageNode(item.sender, item.message);
          chatSpace.appendChild(node);
        });
        firstIndex = data[0].index;
        lastIndex = data[data.length - 1].index;
        
        if (firstIndex <= 1) hasMoreHistory = false;
        scrollToBottom();
      }
    } catch(e) {
      console.error("초기 로드 오류:", e);
    }
  }

  // 실시간 새 메시지 감지
  async function pollNewMessages() {
    if (!GAS_URL || GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") return;
    
    try {
      const res = await fetch(`${GAS_URL}?mode=poll&lastIndex=${lastIndex}`);
      const data = await res.json();
      
      if (data && data.length > 0) {
        data.forEach(item => {
          appendMessage(item.sender, item.message);
          lastIndex = item.index;
        });
      }
    } catch(e) {
      console.error("실시간 동기화 오류:", e);
    }
  }

  // 이전 대화 불러오기: 마찬가지로 화면 크기에 맞춰 동적 개수 요청
  async function loadMoreHistory() {
    if (isLoadingMore || !hasMoreHistory || firstIndex <= 1) return;
    isLoadingMore = true;

    const previousScrollHeight = chatSpace.scrollHeight;
    const limit = calcDynamicLimit();

    try {
      const res = await fetch(`${GAS_URL}?mode=more&beforeIndex=${firstIndex}&limit=${limit}`);
      const data = await res.json();

      if (data && data.length > 0) {
        const fragment = document.createDocumentFragment();
        data.forEach(item => {
          const node = createMessageNode(item.sender, item.message);
          fragment.appendChild(node);
        });
        
        chatSpace.insertBefore(fragment, chatSpace.firstChild);
        firstIndex = data[0].index;

        const newScrollHeight = chatSpace.scrollHeight;
        chatSpace.scrollTop = newScrollHeight - previousScrollHeight;

        if (firstIndex <= 1) hasMoreHistory = false;
      } else {
        hasMoreHistory = false;
      }
    } catch(e) {
      console.error("이전 대화 로드 오류:", e);
    } finally {
      isLoadingMore = false;
    }
  }

  async function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    appendMessage(currentUser, text);
   // 전송 완료 직후 입력창으로 커서(포커스) 재이동
    input.focus();

    if (GAS_URL && GAS_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ sender: currentUser, message: text })
        });
        pollNewMessages();
      } catch(e) {
        console.error("전송 실패:", e);
      }
    }
  }

  function startPolling() {
    if (!pollTimer) {
      pollNewMessages();
      pollTimer = setInterval(pollNewMessages, 3000);
    }
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPolling();
    else startPolling();
  });

  // 스크롤 상단 감지
  chatSpace.addEventListener('scroll', () => {
    if (chatSpace.scrollTop <= 30) {
      loadMoreHistory();
    }
  });

  // 스크롤바가 아직 생기지 않았을 때 휠 제스처 감지
  chatSpace.addEventListener('wheel', (e) => {
    if (chatSpace.scrollTop === 0 && e.deltaY < 0) {
      loadMoreHistory();
    }
  });

  async function init() {
    await initMessages();
    startPolling();
  }

  init();
</script>

</body>
</html>
