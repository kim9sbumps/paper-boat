<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종이배</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #e2ddd5;
      font-family: 'Gowun Batang', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2c2520;
    }

    .paper-container {
      width: 100%;
      max-width: 460px;
      height: 100vh;
      max-height: 840px;
      background: #faf7f2;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 480px) {
      .paper-container {
        height: 92vh;
        border-radius: 8px;
      }
    }

    /* 대화 영역 */
    .chat-space {
      flex: 1;
      padding: 36px 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .chat-space::-webkit-scrollbar {
      width: 4px;
    }
    .chat-space::-webkit-scrollbar-thumb {
      background: #e3ddd3;
      border-radius: 2px;
    }

    /* 메시지 래퍼 */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      position: relative;
      animation: fadeIn 0.3s ease-in-out;
    }

    .msg-wrapper.is-consecutive {
      margin-top: -8px;
    }
    
    /* 발신자별 정렬 */
    .my-msg {
      align-self: flex-end;
      align-items: flex-end;
      text-align: right;
    }
    .other-msg {
      align-self: flex-start;
      align-items: flex-start;
      text-align: left;
    }

    /* 텍스트 본문 */
    .note-line {
      font-size: 15px;
      line-height: 1.65;
      word-break: break-all;
    }

    /* 첨부 사진 (폴라로이드 스타일 프레임) */
    .attached-photo-frame {
      margin-top: 6px;
      background: #ffffff;
      padding: 5px;
      border: 1px solid #e0d8ce;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .attached-photo-frame:hover {
      transform: scale(1.02);
    }
    .attached-img {
      max-width: 200px;
      max-height: 240px;
      display: block;
      border-radius: 2px;
      object-fit: cover;
    }

    /* 잉크 칼라 */
    .color-soleum { color: #800000; }
    .color-saheon { color: #386b2c; }

    /* 메타 영역 (시간 & 수정/삭제 버튼) */
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .my-msg .msg-meta {
      flex-direction: row-reverse;
    }
    .msg-time {
      font-size: 11px;
      color: #a59b91;
    }

    /* 수정/삭제 버튼 */
    .msg-actions {
      display: none;
      gap: 5px;
      font-size: 10px;
      color: #b5a99d;
    }
    .msg-wrapper:hover .msg-actions,
    .msg-wrapper:active .msg-actions {
      display: inline-flex;
    }
    .action-btn {
      cursor: pointer;
      border: none;
      background: none;
      font-family: 'Gowun Batang', serif;
      font-size: 10px;
      color: #9e9083;
      padding: 0 1px;
    }
    .action-btn:hover {
      color: #4a3e35;
      text-decoration: underline;
    }

    /* 사진 첨부 미리보기 바 (입력창 상단) */
    .attach-preview-bar {
      display: none;
      padding: 8px 20px;
      background: #f4ede4;
      border-top: 1px solid #e8e2d7;
      align-items: center;
      gap: 10px;
    }
    .preview-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #d4c8bb;
    }
    .preview-info {
      font-size: 12px;
      color: #7a6e62;
      flex: 1;
    }
    .cancel-attach-btn {
      background: none;
      border: none;
      font-size: 14px;
      color: #8c7b6c;
      cursor: pointer;
    }

    /* 하단 연필선 입력 영역 */
    .input-box {
      padding: 14px 20px 20px;
      background: #faf7f2;
      border-top: 1px solid #e8e2d7;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .clip-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8c7b6c;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .clip-btn:hover {
      opacity: 1;
    }
    .clip-icon {
      width: 20px;
      height: 20px;
    }
    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      border-bottom: 1px solid #a89a8b;
      font-family: 'Gowun Batang', serif;
      font-size: 14px;
      padding: 8px 4px;
      outline: none;
      color: #2c2520;
    }
    input[type="text"]::placeholder {
      color: #b0a59a;
    }
    button#sendBtn {
      background: #8c7b6c;
      color: #fff;
      border: none;
      padding: 8px 18px;
      font-family: 'Gowun Batang', serif;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s;
    }
    button#sendBtn:hover {
      background: #786a5c;
    }
    button#sendBtn:disabled {
      background: #c2b8ad;
      cursor: not-allowed;
    }

    /* 사진 확대 모달(Lightbox) */
    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(30, 26, 22, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      backdrop-filter: blur(4px);
    }
    .image-modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      background: #faf7f2;
      padding: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="paper-container">
  <div class="chat-space" id="chatSpace"></div>

  <!-- 사진 첨부 미리보기 바 -->
  <div class="attach-preview-bar" id="previewBar">
    <img id="previewImg" class="preview-thumb" src="" alt="미리보기">
    <span class="preview-info">사진이 첨부되었습니다.</span>
    <button class="cancel-attach-btn" onclick="clearAttachedImage()" title="첨부 취소">✕</button>
  </div>

  <div class="input-box">
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    <button class="clip-btn" onclick="document.getElementById('fileInput').click()" title="사진 첨부">
      <svg class="clip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <input type="text" id="msgInput" placeholder="종이배에 메시지를 남겨 보세요." onkeyup="if(event.key==='Enter') sendMsg()">
    <button id="sendBtn" onclick="sendMsg()">전송</button>
  </div>
</div>

<!-- 사진 전체화면 확대 라이트박스 -->
<div class="image-modal" id="imageModal" onclick="closeImageModal()">
  <img id="modalImg" src="" alt="확대된 사진">
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
  import { 
    getDatabase, 
    ref, 
    push, 
    onChildAdded, 
    onChildChanged, 
    onChildRemoved, 
    query, 
    orderByChild, 
    limitToLast, 
    endBefore, 
    get, 
    update, 
    remove 
  } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4gexCqmXXR0BoWWIl3j84De-NrX7msYA",
    authDomain: "paper-boat-695f8.firebaseapp.com",
    databaseURL: "https://paper-boat-695f8-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "paper-boat-695f8",
    storageBucket: "paper-boat-695f8.firebasestorage.app",
    messagingSenderId: "500229195135",
    appId: "1:500229195135:web:cdb336f8acdcbe662b064a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'messages');

  const urlParams = new URLSearchParams(window.location.search);
  const rawUser = urlParams.get('user') || '김솔음';
  const currentUser = decodeURIComponent(rawUser);

  const chatSpace = document.getElementById('chatSpace');
  const sendBtn = document.getElementById('sendBtn');
  let currentBase64Image = null;

  function calculateDynamicPageSize() {
    const spaceHeight = chatSpace.clientHeight || window.innerHeight;
    const calculated = Math.ceil(spaceHeight / 60) + 4;
    return Math.max(12, Math.min(calculated, 35));
  }

  const PAGE_SIZE = calculateDynamicPageSize();
  let oldestTimestamp = null;
  let isLoadingMore = false;
  let hasMoreHistory = true;
  let isInitialLoad = true;
  let lastSender = null;
  let lastTimeStr = null;

  function formatTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    let hours = date.getHours();
    const minutes = date.getMinutes().toString().padStart(2, '0');
    const ampm = hours >= 12 ? '오후' : '오전';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${ampm} ${hours}:${minutes}`;
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatSpace.scrollTop = chatSpace.scrollHeight;
    });
  }

  function isNearBottom() {
    return (chatSpace.scrollHeight - chatSpace.scrollTop - chatSpace.clientHeight) < 250;
  }

  // 메시지 렌더링 노드 생성
  function createMessageNode(sender, message, timestamp, key, imageUrl = null, isConsecutive = false) {
    const wrapper = document.createElement('div');
    const isMyMsg = (sender === currentUser);
    const alignClass = isMyMsg ? 'my-msg' : 'other-msg';
    const colorClass = (sender === '김솔음') ? 'color-soleum' : 'color-saheon';

    wrapper.className = `msg-wrapper ${alignClass} ${isConsecutive ? 'is-consecutive' : ''}`;
    if (key) wrapper.setAttribute('data-key', key);
    wrapper.setAttribute('data-sender', sender);
    wrapper.setAttribute('data-time', formatTime(timestamp));

    if (message) {
      const line = document.createElement('div');
      line.className = `note-line ${colorClass}`;
      line.innerText = message;
      wrapper.appendChild(line);
    }

    // 사진이 첨부된 경우
    if (imageUrl) {
      const frame = document.createElement('div');
      frame.className = 'attached-photo-frame';
      frame.onclick = () => openImageModal(imageUrl);

      const img = document.createElement('img');
      img.className = 'attached-img';
      img.src = imageUrl;
      img.alt = '첨부된 사진';

      // ★ 핵심: 이미지가 실제 브라우저에 로드되어 높이가 생겼을 때 스크롤 재보정
      img.onload = () => {
        if (isInitialLoad || isNearBottom()) {
          scrollToBottom();
        }
      };

      frame.appendChild(img);
      wrapper.appendChild(frame);
    }

    const metaDiv = document.createElement('div');
    metaDiv.className = 'msg-meta';

    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.innerText = formatTime(timestamp);
    metaDiv.appendChild(timeDiv);

    // 수정 및 삭제
    if (isMyMsg && key) {
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';

      if (message) {
        const editBtn = document.createElement('button');
        editBtn.className = 'action-btn';
        editBtn.innerText = '수정';
        editBtn.onclick = () => editMessage(key, message);
        actionsDiv.appendChild(editBtn);
        actionsDiv.appendChild(document.createTextNode('·'));
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'action-btn';
      delBtn.innerText = '삭제';
      delBtn.onclick = () => deleteMessage(key);
      actionsDiv.appendChild(delBtn);

      metaDiv.appendChild(actionsDiv);
    }

    wrapper.appendChild(metaDiv);
    return wrapper;
  }

  // 라이트박스 열기/닫기
  window.openImageModal = function(src) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    modalImg.src = src;
    modal.style.display = 'flex';
  };

  window.closeImageModal = function() {
    document.getElementById('imageModal').style.display = 'none';
  };

  // 이미지 압축
  window.handleFileSelect = function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 800;

        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        currentBase64Image = canvas.toDataURL('image/jpeg', 0.75);

        document.getElementById('previewImg').src = currentBase64Image;
        document.getElementById('previewBar').style.display = 'flex';
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  };

  window.clearAttachedImage = function() {
    currentBase64Image = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('previewBar').style.display = 'none';
  };

  // 수정
  window.editMessage = function(key, currentText) {
    const newText = prompt('메시지를 수정하세요:', currentText);
    if (newText === null) return;
    const trimmed = newText.trim();
    if (!trimmed) {
      alert('내용을 입력해 주세요.');
      return;
    }
    update(ref(db, `messages/${key}`), { message: trimmed });
  };

  // 삭제
  window.deleteMessage = function(key) {
    if (!confirm('이 메시지를 지울까요?')) return;
    remove(ref(db, `messages/${key}`));
  };

  function reprocessConsecutiveTimestamps() {
    const wrappers = chatSpace.querySelectorAll('.msg-wrapper');
    for (let i = 0; i < wrappers.length; i++) {
      const current = wrappers[i];
      const next = wrappers[i + 1];

      const timeNode = current.querySelector('.msg-time');
      if (!timeNode) continue;

      if (next) {
        const curSender = current.getAttribute('data-sender');
        const nextSender = next.getAttribute('data-sender');
        const curTime = current.getAttribute('data-time');
        const nextTime = next.getAttribute('data-time');

        if (curSender === nextSender && curTime === nextTime) {
          timeNode.style.display = 'none';
        } else {
          timeNode.style.display = 'block';
        }
      } else {
        timeNode.style.display = 'block';
      }
    }
  }

  // 상단 과거 대화 불러오기
  async function loadMoreHistory() {
    if (isLoadingMore || !hasMoreHistory || !oldestTimestamp) return;
    isLoadingMore = true;

    const previousScrollHeight = chatSpace.scrollHeight;

    const historyQuery = query(
      messagesRef,
      orderByChild('timestamp'),
      endBefore(oldestTimestamp),
      limitToLast(PAGE_SIZE)
    );

    try {
      const snapshot = await get(historyQuery);
      if (snapshot.exists()) {
        const data = snapshot.val();
        const keys = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);

        if (keys.length < PAGE_SIZE) {
          hasMoreHistory = false;
        }

        keys.forEach((key) => {
          const msg = data[key];
          if (!document.querySelector(`[data-key="${key}"]`)) {
            const node = createMessageNode(msg.sender, msg.message, msg.timestamp, key, msg.image);
            chatSpace.insertBefore(node, chatSpace.firstChild);
            oldestTimestamp = Math.min(oldestTimestamp, msg.timestamp);
          }
        });

        reprocessConsecutiveTimestamps();
        chatSpace.scrollTop = chatSpace.scrollHeight - previousScrollHeight;
      } else {
        hasMoreHistory = false;
      }
    } catch (e) {
      console.error("과거 내역 로드 실패:", e);
    } finally {
      isLoadingMore = false;
    }
  }

  // 실시간 메시지 감지
  const initialQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(PAGE_SIZE));

  onChildAdded(initialQuery, (snapshot) => {
    const data = snapshot.val();
    const key = snapshot.key;

    if (data && !document.querySelector(`[data-key="${key}"]`)) {
      const timeStr = formatTime(data.timestamp);
      const isConsecutive = (lastSender === data.sender && lastTimeStr === timeStr && !data.image);

      const node = createMessageNode(data.sender, data.message, data.timestamp, key, data.image, isConsecutive);
      chatSpace.appendChild(node);

      lastSender = data.sender;
      lastTimeStr = timeStr;

      if (!oldestTimestamp || data.timestamp < oldestTimestamp) {
        oldestTimestamp = data.timestamp;
      }

      reprocessConsecutiveTimestamps();

      if (isInitialLoad || isNearBottom()) {
        scrollToBottom();
      }
    }
  });

  onChildChanged(messagesRef, (snapshot) => {
    const key = snapshot.key;
    const data = snapshot.val();
    const el = document.querySelector(`[data-key="${key}"]`);
    if (el && data && data.message) {
      const line = el.querySelector('.note-line');
      if (line) line.innerText = data.message;
    }
  });

  onChildRemoved(messagesRef, (snapshot) => {
    const key = snapshot.key;
    const el = document.querySelector(`[data-key="${key}"]`);
    if (el) {
      el.remove();
      reprocessConsecutiveTimestamps();
    }
  });

  setTimeout(() => {
    isInitialLoad = false;
    scrollToBottom();
  }, 400);

  chatSpace.addEventListener('scroll', () => {
    if (chatSpace.scrollTop <= 40) {
      loadMoreHistory();
    }
  });

  // 메시지 및 사진 전송
  window.sendMsg = function() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();

    if (!text && !currentBase64Image) return;

    input.value = '';
    sendBtn.disabled = true;

    const payload = {
      sender: currentUser,
      message: text || '',
      timestamp: Date.now()
    };

    if (currentBase64Image) {
      payload.image = currentBase64Image;
    }

    push(messagesRef, payload).then(() => {
      clearAttachedImage();
      input.focus();
      scrollToBottom();
    }).catch((error) => {
      console.error("Firebase 전송 실패:", error);
    }).finally(() => {
      sendBtn.disabled = false;
    });
  };
</script>

</body>
</html>
