<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종이배</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #e5e0d8;
      font-family: 'Gowun Batang', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .paper-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #faf7f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-space {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-space > .note-line:first-child {
      margin-top: auto;
    }
    .note-line {
      font-size: 16px;
      line-height: 20px;
      word-break: break-all;
      animation: fadeIn 0.3s ease-in-out;
    }

    .my-msg { text-align: right; margin-left: 25%; }
    .other-msg { text-align: left; margin-right: 25%; }

    .color-soleum { color: #800000; } /* 김솔음: 버건디 잉크 */
    .color-saheon { color: #386b2c; } /* 백사헌: 올리브 그린 잉크 */

    .input-box {
      padding: 16px 20px;
      background: #faf7f0;
      border-top: 1px solid #e3ddd3;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1; border: none; background: transparent;
      border-bottom: 1px solid #8c7b6c;
      font-family: 'Gowun Batang', serif;
      font-size: 15px; padding: 6px 4px; outline: none; color: #2c2520;
    }
    button {
      background: #8c7b6c; color: #fff; border: none;
      padding: 6px 16px; font-family: 'Gowun Batang', serif;
      font-size: 14px; cursor: pointer; border-radius: 2px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="paper-container">
  <div class="chat-space" id="chatSpace"></div>
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="종이배에 메시지를 남겨 보세요." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">전송</button>
  </div>
</div>

<!-- Firebase SDK 모듈 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

  // ★ 방금 주우신 firebaseConfig 코드를 여기에 통째로 붙여넣어 주세요!
  const firebaseConfig = {
    apiKey: "AIzaSyD4gexCqmXXR0BoWWIl3j84De-NrX7msYA",
    authDomain: "paper-boat-695f8.firebaseapp.com",
    databaseURL: "https://paper-boat-695f8-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "paper-boat-695f8",
    storageBucket: "paper-boat-695f8.firebasestorage.app",
    messagingSenderId: "500229195135",
    appId: "1:500229195135:web:cdb336f8acdcbe662b064a"
  };

  // Firebase 및 Realtime Database 초기화
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'messages');

  const urlParams = new URLSearchParams(window.location.search);
  const rawUser = urlParams.get('user') || '김솔음';
  const currentUser = decodeURIComponent(rawUser);

  const chatSpace = document.getElementById('chatSpace');

  function createMessageNode(sender, message, key) {
    const line = document.createElement('div');
    const alignClass = (sender === currentUser) ? 'my-msg' : 'other-msg';
    const colorClass = (sender === '김솔음') ? 'color-soleum' : 'color-saheon';
    
    line.className = `note-line ${alignClass} ${colorClass}`;
    if (key) line.setAttribute('data-key', key);
    line.innerText = message;
    return line;
  }

  function scrollToBottom() {
    chatSpace.scrollTop = chatSpace.scrollHeight;
  }

  // 최근 100개 메시지 실시간 구독 (접속 시 즉시 표시 + 새 메시지 0.1초 반응)
  const recentMessagesQuery = query(messagesRef, limitToLast(100));

  onChildAdded(recentMessagesQuery, (snapshot) => {
    const data = snapshot.val();
    const key = snapshot.key;

    if (!document.querySelector(`[data-key="${key}"]`)) {
      const node = createMessageNode(data.sender, data.message, key);
      chatSpace.appendChild(node);
      scrollToBottom();
    }
  });

  // 메시지 전송
  window.sendMsg = function() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.focus();

    push(messagesRef, {
      sender: currentUser,
      message: text,
      timestamp: Date.now()
    });
  };
</script>

</body>
</html>
