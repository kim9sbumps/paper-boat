<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종이배</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #e2ddd5;
      font-family: 'Gowun Batang', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2c2520;
    }

    .paper-container {
      width: 100%;
      max-width: 460px;
      height: 100vh;
      max-height: 840px;
      background: #faf7f2;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 480px) {
      .paper-container {
        height: 92vh;
        border-radius: 8px;
      }
    }

    /* 대화 영역 (여백 확보) */
    .chat-space {
      flex: 1;
      padding: 30px 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    
    .chat-space::-webkit-scrollbar {
      width: 4px;
    }
    .chat-space::-webkit-scrollbar-thumb {
      background: #e3ddd3;
      border-radius: 2px;
    }

    /* 메시지 래퍼 */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeIn 0.35s ease-in-out;
    }
    
    /* 발신자별 정렬 */
    .my-msg {
      align-self: flex-end;
      align-items: flex-end;
      text-align: right;
    }
    .other-msg {
      align-self: flex-start;
      align-items: flex-start;
      text-align: left;
    }

    /* 텍스트 본문 (말풍선/배경 없음) */
    .note-line {
      font-size: 15px;
      line-height: 1.65;
      word-break: break-all;
    }

    /* 잉크 칼라 */
    .color-soleum { color: #800000; } /* 김솔음: 버건디 잉크 */
    .color-saheon { color: #386b2c; } /* 백사헌: 올리브 그린 잉크 */

    /* 타임스탬프 (메시지 정렬에 맞춰 나란히 배치) */
    .msg-time {
      font-size: 11px;
      color: #a59b91;
      margin-top: 4px;
    }

    /* 하단 연필선 입력 영역 */
    .input-box {
      padding: 16px 20px 22px;
      background: #faf7f2;
      border-top: 1px solid #e8e2d7;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      border-bottom: 1px solid #a89a8b;
      font-family: 'Gowun Batang', serif;
      font-size: 14px;
      padding: 8px 4px;
      outline: none;
      color: #2c2520;
    }
    input[type="text"]::placeholder {
      color: #b0a59a;
    }
    button {
      background: #8c7b6c;
      color: #fff;
      border: none;
      padding: 8px 18px;
      font-family: 'Gowun Batang', serif;
      font-size: 14px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s;
    }
    button:hover {
      background: #786a5c;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="paper-container">
  <div class="chat-space" id="chatSpace"></div>
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="종이배에 메시지를 남겨 보세요." onkeyup="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">전송</button>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4gexCqmXXR0BoWWIl3j84De-NrX7msYA",
    authDomain: "paper-boat-695f8.firebaseapp.com",
    databaseURL: "https://paper-boat-695f8-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "paper-boat-695f8",
    storageBucket: "paper-boat-695f8.firebasestorage.app",
    messagingSenderId: "500229195135",
    appId: "1:500229195135:web:cdb336f8acdcbe662b064a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'messages');

  const urlParams = new URLSearchParams(window.location.search);
  const rawUser = urlParams.get('user') || '김솔음';
  const currentUser = decodeURIComponent(rawUser);

  const chatSpace = document.getElementById('chatSpace');

  function formatTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    let hours = date.getHours();
    const minutes = date.getMinutes().toString().padStart(2, '0');
    const ampm = hours >= 12 ? '오후' : '오전';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${ampm} ${hours}:${minutes}`;
  }

  function createMessageNode(sender, message, timestamp, key) {
    const wrapper = document.createElement('div');
    const isMyMsg = (sender === currentUser);
    const alignClass = isMyMsg ? 'my-msg' : 'other-msg';
    const colorClass = (sender === '김솔음') ? 'color-soleum' : 'color-saheon';

    wrapper.className = `msg-wrapper ${alignClass}`;
    if (key) wrapper.setAttribute('data-key', key);

    const line = document.createElement('div');
    line.className = `note-line ${colorClass}`;
    line.innerText = message;

    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.innerText = formatTime(timestamp);

    wrapper.appendChild(line);
    wrapper.appendChild(timeDiv);

    return wrapper;
  }

  function scrollToBottom() {
    chatSpace.scrollTop = chatSpace.scrollHeight;
  }

  const recentMessagesQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(200));

  onChildAdded(recentMessagesQuery, (snapshot) => {
    const data = snapshot.val();
    const key = snapshot.key;

    if (data && data.message && !document.querySelector(`[data-key="${key}"]`)) {
      const node = createMessageNode(data.sender, data.message, data.timestamp, key);
      chatSpace.appendChild(node);
      scrollToBottom();
    }
  });

  window.sendMsg = function() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    push(messagesRef, {
      sender: currentUser,
      message: text,
      timestamp: Date.now()
    }).then(() => {
      input.focus();
    }).catch((error) => {
      console.error("Firebase 전송 실패:", error);
    });
  };
</script>

</body>
</html>
